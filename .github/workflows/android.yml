name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK (plus a per-version copy)
        id: apk
        run: |
          set -e
          VER=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          [ -n "$VER" ] || VER="dev"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk aura.apk
          # A uniquely-named copy so each version is a fresh download URL
          # (a single same-named asset gets cached by the CDN/browser).
          cp android/app/build/outputs/apk/debug/app-debug.apk "aura-v${VER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: aura.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aura — Android APK
          body: |
            **Aura** for Android — a full-screen shell around the live web app.

            Latest version: **v${{ steps.apk.outputs.ver }}**

            Download the versioned file below (e.g. `aura-v${{ steps.apk.outputs.ver }}.apk`) —
            each version is a fresh URL, so you never install a cached old copy.
            Then enable *Install unknown apps* for your browser/file manager and open it.
            (Debug-signed build; Play Protect may warn — tap *Install anyway*.)
          files: |
            aura.apk
            aura-v${{ steps.apk.outputs.ver }}.apk
