name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aura.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: aura.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aura — Android APK
          body: |
            **Aura** for Android — a full-screen shell around the live web app.

            Install: download `aura.apk`, then on your phone enable
            *Install unknown apps* for your browser/file manager and open it.
            (Debug-signed build; Play Protect may warn — tap *Install anyway*.)
          files: aura.apk
