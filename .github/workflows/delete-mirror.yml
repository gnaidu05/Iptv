name: Delete Cloudflare mirror

# One-off cleanup: removes the stray "iptv" Worker (the iptv.gnaidu05.workers.dev
# mirror created by the one-click deploy). Uses the CLOUDFLARE_API_TOKEN repo
# secret. Targets ONLY the script named "iptv" — the aura-proxy Worker and
# everything else are left untouched.

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: Worker script to delete
        default: iptv
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NAME: ${{ github.event.inputs.script_name }}
    steps:
      - name: Delete the mirror Worker
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; fi
          if [ "$NAME" = "aura-proxy" ]; then echo "::error::refusing to delete the proxy worker"; exit 1; fi

          echo "Token check:"
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{success, status: .result.status}'

          ACCTS=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts | jq -r '.result[].id')
          echo "Accounts found: $(echo "$ACCTS" | wc -w)"

          deleted=0
          for A in $ACCTS; do
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/$NAME?force=true")
            echo "account $A → DELETE $NAME : HTTP $code"
            jq -c '{success, errors}' /tmp/resp.json || cat /tmp/resp.json
            [ "$code" = "200" ] && deleted=1 || true
          done

          if [ "$deleted" = "1" ]; then
            echo "✅ Deleted Worker '$NAME'. The $NAME.*.workers.dev URL will stop serving."
          else
            echo "::warning::No '$NAME' Worker was deleted. If the mirror is a Pages project instead, remove it in the dashboard (Workers & Pages → $NAME → Manage → Delete)."
          fi
