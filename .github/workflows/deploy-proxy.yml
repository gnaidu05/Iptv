name: Deploy CORS proxy (Cloudflare Worker)

# Deploys proxy/worker.js to YOUR Cloudflare account.
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN
#   (GitHub → Settings → Secrets and variables → Actions → New repository secret).
#   Create the token at https://dash.cloudflare.com/profile/api-tokens using the
#   "Edit Cloudflare Workers" template.
#   If your login has more than one Cloudflare account, also add
#   CLOUDFLARE_ACCOUNT_ID (shown in the dashboard URL / Workers overview).
# Then run this workflow (Actions tab → "Deploy CORS proxy" → Run workflow).
# The deployed https://<name>.<you>.workers.dev URL prints in the deploy step.
#
# Device-logs-to-repo (optional): also add a repo secret GH_LOG_TOKEN (a GitHub
# token with `repo` scope). When present, this workflow installs it onto the
# Worker as a secret automatically, so the /log endpoint can forward device
# diagnostics into logs/. No local wrangler/CLI needed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Expose the optional log token as an env var so steps can test for it in
    # `if:` conditions (the `secrets` context isn't allowed there directly).
    env:
      GH_LOG_TOKEN: ${{ secrets.GH_LOG_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy

      # Install the GitHub log token onto the Worker (only if the secret is set),
      # so the /log endpoint can forward device diagnostics into the repo.
      # `wrangler secret put` reads the value from stdin, so no CLI prompt.
      - name: Install GH_LOG_TOKEN on the Worker
        if: ${{ env.GH_LOG_TOKEN != '' }}
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$GH_LOG_TOKEN" | npx --yes wrangler@3 secret put GH_LOG_TOKEN

      - name: Next step
        run: |
          echo "Worker deployed. Copy the https://...workers.dev URL printed above,"
          echo "open Aura → Help (gear) → 'Play extra channels', paste it, and Save."
          if [ -n "$GH_LOG_TOKEN" ]; then
            echo "GH_LOG_TOKEN installed — device logs will be committed under logs/."
          else
            echo "GH_LOG_TOKEN not set — device-logs-to-repo is off (optional)."
          fi
