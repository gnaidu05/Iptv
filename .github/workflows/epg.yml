name: Refresh EPG (now/next)

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  epg:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild EPG database
        run: python scripts/build_epg.py

      - name: Commit updated EPG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webstb/epg.json
          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "chore: refresh EPG now/next data"
            # Race-proof push: another run can land on main while this job runs.
            # Merge it in, keeping OUR freshly-regenerated epg.json on any
            # conflict (a plain rebase/pull would abort on the conflict and fail,
            # which also skips the Pages deploy below).
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected; merging latest main (keeping our epg.json)… attempt $i"
              git fetch origin main
              git merge -X ours --no-edit origin/main || { git merge --abort; exit 1; }
              sleep $((i * 2))
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
