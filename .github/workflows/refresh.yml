name: Weekly channel refresh

on:
  schedule:
    - cron: "0 5 * * 1"      # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Re-check streams and prune dead channels
        run: python scripts/refresh.py

      - name: Rebuild EPG database (keep channel numbering in sync)
        run: python scripts/build_epg.py

      - name: Commit refreshed playlists
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists webstb/channels.js webstb/epg.json
          if git diff --cached --quiet; then
            echo "No channel changes this week."
          else
            git commit -m "chore: weekly channel refresh (auto-pruned dead streams)"
            # Race-proof push: rebase and retry if main moved under us.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected, rebasing onto latest main (attempt $i)…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
