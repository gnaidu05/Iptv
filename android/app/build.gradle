plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.aura.app'
    compileSdk 34

    defaultConfig {
        applicationId "tv.aura.app"
        // Lollipop (5.0) is the practical floor — it has the modern, updatable
        // WebView and the request-interception API the app relies on, and covers
        // essentially every Android phone and TV still in use.
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed by default via assembleDebug; release build left
            // unsigned unless a keystore is supplied. The CI ships assembleDebug.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
