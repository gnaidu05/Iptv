[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m3u"
version = "0.1.0"
description = "A small, dependency-free library and CLI for parsing and writing M3U/M3U8 playlists."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["m3u", "m3u8", "playlist", "iptv", "extinf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
m3u = "m3u.cli:main"

[project.optional-dependencies]
check = ["requests>=2.25"]
dev = ["pytest>=7.0", "requests>=2.25"]

[tool.setuptools.packages.find]
include = ["m3u*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
